name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle (NeoForge + Fabric)
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test --stacktrace

      - name: Collect mod jars
        run: |
          mkdir -p dist
          for f in neoforge/build/libs/*.jar fabric/build/libs/*.jar; do
            case "$f" in *-sources.jar|*-dev*.jar|*-shadow*.jar) continue ;; esac
            cp "$f" dist/
          done
          ls -la dist
          test -n "$(ls dist)"

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: jsn-mahjong-jars
          path: dist/*.jar
          if-no-files-found: error

      - name: Publish the latest jars to the Releases page
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.jar --prerelease --target "$GITHUB_SHA" \
            --title "最新版（自動ビルド）" \
            --notes "main ブランチの最新の自動ビルドです。NeoForge 1.21.1 用は neoforge、Fabric 1.21.1 用は fabric と名前に入っている jar を使ってください。"
